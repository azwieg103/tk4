name: Mirror upstream TK4-

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mirror-tk4.yml
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tk4-upstream-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Build and publish TK4- release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl unzip zip

      - name: Obtain TK4- distribution
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="tk4-_v1.00_current.zip"
          source_file="tk4-source.txt"
          primary="https://wotho.ethz.ch/tk4-/${archive}"
          alternate="https://wotho.pebble-beach.ch/tk4-/${archive}"
          source_description=""

          download_upstream() {
            local url="$1"
            echo "Trying upstream: ${url}"
            curl --fail --location --silent --show-error \
              --retry 1 --retry-delay 2 --connect-timeout 20 --max-time 900 \
              --proto '=https' --tlsv1.2 --output "${archive}" "${url}" || return 1
            test -s "${archive}" || return 1
            unzip -tq "${archive}" || return 1
            unzip -Z1 "${archive}" | grep -Fxq 'conf/tk4-.cnf' || return 1
            source_description="Official upstream archive: ${url}"
          }

          if ! download_upstream "${primary}"; then
            echo "Primary upstream unavailable or invalid; trying alternate."
            rm -f "${archive}"
            if ! download_upstream "${alternate}"; then
              echo "Both official endpoints failed. Building the same TK4- directory layout from the public GitHub source mirror."
              rm -f "${archive}"
              rm -rf mirror
              git clone --depth 1 https://github.com/actualquak/tk4.git mirror
              mirror_commit="$(git -C mirror rev-parse HEAD)"
              test -s "mirror/conf/tk4-.cnf"
              test -s "mirror/dasd/mvsres.148"
              git -C mirror archive --format=zip --output="${GITHUB_WORKSPACE}/${archive}" HEAD
              source_description="Repacked from public GitHub source mirror https://github.com/actualquak/tk4 at commit ${mirror_commit}. This is a source-mirror snapshot, not the original upstream ZIP."
            fi
          fi

          test -s "${archive}"
          unzip -tq "${archive}"
          unzip -Z1 "${archive}" | grep -Fxq 'conf/tk4-.cnf'
          unzip -Z1 "${archive}" | grep -Fxq 'dasd/mvsres.148'
          printf '%s\n' "${source_description}" > "${source_file}"
          sha256sum "${archive}" > "${archive}.sha256"
          digest="$(sha256sum "${archive}" | awk '{print $1}')"
          echo "description=${source_description}" >> "$GITHUB_OUTPUT"
          echo "sha256=${digest}" >> "$GITHUB_OUTPUT"

      - name: Compare with latest mirrored release
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="tk4-_v1.00_current.zip"
          latest_tag="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 1 --json tagName --jq '.[0].tagName // empty')"
          previous_digest=""

          if [[ -n "${latest_tag}" ]]; then
            mkdir -p previous
            if gh release download "${latest_tag}" --repo "${GITHUB_REPOSITORY}" \
                --pattern "${archive}.sha256" --dir previous; then
              previous_digest="$(awk 'NR==1 {print $1}' "previous/${archive}.sha256")"
            fi
          fi

          current_digest="${{ steps.source.outputs.sha256 }}"
          echo "Latest release: ${latest_tag:-none}"
          echo "Previous SHA-256: ${previous_digest:-none}"
          echo "Current SHA-256: ${current_digest}"

          if [[ "${current_digest}" == "${previous_digest}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="tk4-1.00-${current_digest:0:12}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Publish new immutable TK4- release
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="tk4-_v1.00_current.zip"
          tag="${{ steps.compare.outputs.tag }}"
          source_description="${{ steps.source.outputs.description }}"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; no duplicate release created."
            exit 0
          fi

          gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" \
            "${archive}" "${archive}.sha256" "tk4-source.txt" \
            --title "TK4- 1.00 mirror ${tag#tk4-1.00-}" \
            --notes "Automated TK4- distribution mirror.

          Source: ${source_description}

          The ZIP is validated before publication. SHA-256 is provided as a
          separate asset. If the official HTTPS distribution endpoints are
          unavailable, the workflow uses the public GitHub source mirror and
          labels that provenance explicitly. Bundled software retains its
          original authorship, credits, and license terms."
