name: Mirror upstream TK4-

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mirror-tk4.yml
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tk4-upstream-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Check upstream archive and publish if changed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install download and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl unzip

      - name: Download upstream TK4- archive
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="tk4-_v1.00_current.zip"
          primary="https://wotho.ethz.ch/tk4-/${archive}"
          alternate="https://wotho.pebble-beach.ch/tk4-/${archive}"

          if curl --fail --location --silent --show-error \
              --retry 2 --retry-delay 3 --connect-timeout 20 --max-time 900 \
              --proto '=https' --tlsv1.2 --output "${archive}" "${primary}"; then
            echo "Downloaded from primary upstream."
          else
            echo "Primary download failed; trying alternate HTTPS mirror."
            rm -f "${archive}"
            curl --fail --location --silent --show-error \
              --retry 2 --retry-delay 3 --connect-timeout 20 --max-time 900 \
              --proto '=https' --tlsv1.2 --output "${archive}" "${alternate}"
          fi

          test -s "${archive}"
          unzip -tq "${archive}"
          sha256sum "${archive}" > "${archive}.sha256"
          digest="$(sha256sum "${archive}" | awk '{print $1}')"
          echo "sha256=${digest}" >> "$GITHUB_OUTPUT"
        id: source

      - name: Compare with latest mirrored release
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="tk4-_v1.00_current.zip"
          latest_tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
          previous_digest=""

          if [[ -n "${latest_tag}" ]]; then
            mkdir -p previous
            if gh release download "${latest_tag}" \
                --pattern "${archive}.sha256" --dir previous; then
              previous_digest="$(awk 'NR==1 {print $1}' "previous/${archive}.sha256")"
            fi
          fi

          current_digest="${{ steps.source.outputs.sha256 }}"
          echo "Latest release: ${latest_tag:-none}"
          echo "Previous SHA-256: ${previous_digest:-none}"
          echo "Current SHA-256: ${current_digest}"

          if [[ "${current_digest}" == "${previous_digest}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="tk4-1.00-${current_digest:0:12}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Publish new immutable TK4- release
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="tk4-_v1.00_current.zip"
          tag="${{ steps.compare.outputs.tag }}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; no duplicate release created."
            exit 0
          fi

          gh release create "${tag}" \
            "${archive}" "${archive}.sha256" \
            --title "TK4- 1.00 mirror ${tag#tk4-1.00-}" \
            --notes "Unmodified upstream TK4- current distribution archive.

          Source: https://wotho.ethz.ch/tk4-/
          Alternate source: https://wotho.pebble-beach.ch/tk4-/

          This release is content-addressed. The SHA-256 checksum is included
          as a separate asset. Upstream archive and bundled components retain
          their own authorship, credits, and license terms."
